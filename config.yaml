# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tune `filters` first. It is deterministic, free, and it is what keeps the
# LLM bill small: roughly 2000 raw postings -> 40 candidates before a single
# token is spent.

filters:

  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.

  include_titles:

    # Software Engineering
    - '\b(software|software development)\b.*\bengineer\b'
    - '\bsoftware development engineer\b'
    - '\bsoftware engineer\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - '\bassociate software engineer\b'
    - '\bjunior software engineer\b'
    - '\bsoftware engineer\s*[-–]?\s*(i|1|entry[- ]level)\b'

    # Fresher / Internship
    - '\b(intern|internship|apprentice|trainee)\b'

    # Full-Stack Development
    - '\bfull[- ]?stack\b.*\bdeveloper\b'
    - '\bfull[- ]?stack\b.*\bengineer\b'
    - '\bfull[- ]?stack software engineer\b'
    - '\bfull[- ]?stack developer\b'
    - '\bassociate full[- ]?stack developer\b'

    # Backend Development
    - '\b(backend|back-end|server-side)\b.*\b(developer|engineer)\b'
    - '\b(developer|engineer)\b.*\b(backend|back-end)\b'
    - '\bbackend developer\b'
    - '\bbackend engineer\b'
    - '\bassociate backend developer\b'
    - '\bjunior backend developer\b'

    # Web Development
    - '\bweb developer\b'
    - '\bweb engineer\b'
    - '\bsoftware web engineer\b'
    - '\bassociate web developer\b'
    - '\bjunior web developer\b'

    # Frontend Development
    - '\b(frontend|front-end)\b.*\b(developer|engineer)\b'
    - '\b(developer|engineer)\b.*\b(frontend|front-end)\b'
    - '\bfrontend developer\b'
    - '\bfrontend engineer\b'
    - '\bassociate frontend developer\b'
    - '\bjunior frontend developer\b'

    # Platform / Systems
    - '\b(platform|systems|distributed|cloud)\b.*\bengineer\b'
    - '\bengineer\b.*\b(platform|systems|distributed|cloud)\b'
    - '\bsite reliability engineer\b'
    - '\bsre\b'
    - '\bmember of technical staff\b'


  exclude_titles:

    # Too senior
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'

    # Different career tracks
    - '\b(sales|account executive|marketing|recruit|recruiter|support|customer success)\b'

    # Different engineering disciplines
    - '\b(ios|android|mobile|game|designer|embedded|firmware)\b'

    # Advanced data/ML research roles
    - '\b(data scientist|machine learning scientist|research scientist)\b'


  # Substrings matched against " ", case-insensitive.
  # Leave empty to accept every location.

  locations:
    - noida
    - delhi
    - faridabad
    - gurugram
    - pune
    - kolkata
    - mumbai
    - hyderabad
    - bangalore
    - greater noida
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8      # jobs per screening call. Higher = cheaper, sloppier.
screen_jd_chars: 1400     # JD truncation for screening
draft_jd_chars: 6000      # JD truncation for drafting
score_threshold: 7.0      # below this, no draft and no digest slot
max_per_digest: 5         # hard cap on expensive draft calls per run

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
